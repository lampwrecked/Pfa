<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PUBLIC FACING</title>
<meta name="description" content="500 portraits. 99 sources. Mint Wednesday, December 9.">
<meta property="og:title" content="PUBLIC FACING">
<meta property="og:description" content="500 portraits. 99 sources. Mint Wednesday, December 9.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  /* Wall: bone paper, ink, one cyan rule. */
  :root {
    --bone: #EFECE5;
    --ink: #1A1A18;
    --ink-dim: #6E6B64;
    --cyan: #6FA3B0;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: var(--bone); color: var(--ink); }
  body {
    font-family: "Cormorant Garamond", Georgia, serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .u {
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
  }

  /* ---- top bar ---- */
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: calc(20px + var(--safe-t)) 24px 20px;
  }
  .wordmark { font-size: 20px; letter-spacing: .32em; font-weight: 500; }
  .burger { width: 44px; height: 44px; display: grid; place-items: center; margin-right: -10px; }
  .burger span, .burger span::before, .burger span::after {
    display: block; width: 22px; height: 1px; background: var(--ink); position: relative; transition: transform .25s, opacity .25s;
  }
  .burger span::before, .burger span::after { content: ""; position: absolute; left: 0; }
  .burger span::before { top: -7px; }
  .burger span::after  { top: 7px; }
  .burger[aria-expanded="true"] span { background: transparent; }
  .burger[aria-expanded="true"] span::before { transform: translateY(7px) rotate(45deg); }
  .burger[aria-expanded="true"] span::after  { transform: translateY(-7px) rotate(-45deg); }

  /* ---- menu ---- */
  #menu {
    position: fixed; inset: 0; z-index: 10; background: var(--bone);
    padding: calc(88px + var(--safe-t)) 24px 24px;
    display: none; flex-direction: column; gap: 6px;
  }
  #menu.open { display: flex; }
  #menu a {
    font-size: clamp(34px, 9vw, 52px); line-height: 1.25; color: var(--ink); text-decoration: none;
    border-bottom: 1px solid rgba(26,26,24,.14); padding: 10px 0;
  }
  #menu a:hover { color: var(--cyan); }
  #menu .u { color: var(--ink-dim); margin-top: auto; }

  /* ---- hero ---- */
  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 8px 24px 40px; text-align: center; gap: 28px;
  }
  .strip {
    width: 100%; height: clamp(120px, 20vw, 280px);
    background: var(--ink); position: relative; overflow: hidden;
  }
  .strip img { width: 100%; height: 100%; object-fit: cover; object-position: 48% 50%; display: block; }
  .strip .ph {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: rgba(239,236,229,.5);
  }

  .rule { width: 56px; height: 2px; background: var(--cyan); }
  h1 { font-weight: 400; font-size: clamp(34px, 9vw, 60px); letter-spacing: .28em; margin-right: -.28em; line-height: 1; }
  .line { font-size: clamp(20px, 4.6vw, 26px); font-style: italic; }
  .dates { display: flex; flex-direction: column; gap: 6px; color: var(--ink-dim); }
  .dates b { color: var(--ink); font-weight: 400; }

  /* ---- signup ---- */
  .signup { width: min(88vw, 420px); }
  .invite-form {
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--ink); padding: 6px 0;
  }
  .invite-form:focus-within { border-bottom-color: var(--cyan); }
  .invite-form input {
    flex: 1; min-width: 0; background: none; border: 0; outline: 0;
    font: inherit; font-size: 20px; color: var(--ink); padding: 6px 0;
  }
  .invite-form input::placeholder { color: var(--ink-dim); font-style: italic; }
  .invite-form button { padding: 10px 2px; }
  .invite-form button:hover { color: var(--cyan); }
  .invite-form button:disabled { opacity: .35; cursor: default; }
  #msg { min-height: 1.4em; margin-top: 10px; color: var(--ink-dim); }
  #msg.err { color: #8a2d2d; }

  footer { padding: 16px 24px calc(20px + var(--safe-b)); text-align: center; color: var(--ink-dim); }
</style>
</head>
<body>

<header>
  <div class="wordmark">PUBLIC FACING</div>
  <button class="burger" id="burger" aria-label="Menu" aria-expanded="false" aria-controls="menu"><span></span></button>
</header>

<nav id="menu" aria-label="Site"></nav>

<div class="strip">
  <!-- Full-width eye strip, 2160x300 from composite 72. Placeholder shows until it loads. -->
  <img src="assets/eye-strip-72-full.jpg" alt="" onload="this.nextElementSibling.remove()" onerror="this.remove()">
  <div class="ph u">Eye strip</div>
</div>

<main>
  <div class="rule"></div>

  <h1>PUBLIC FACING</h1>
  <p class="line">500 portraits. 99 sources.</p>

  <div class="dates u">
    <span>Mint <b>Wednesday, December 9</b></span>
    <span>Reveal <b>Saturday, December 12</b></span>
  </div>

  <div class="signup">
    <form id="signupForm" class="invite-form" novalidate>
      <input type="email" id="emailInput" name="email" placeholder="your@email" autocomplete="email" aria-label="Email address">
      <button type="submit" class="u" id="submitBtn">Notify me</button>
    </form>
    <div id="msg" class="u" role="status" aria-live="polite"></div>
  </div>
</main>

<footer class="u">publicfacing.art</footer>

<script>
  /* ---------------------------------------------------------------
     MENU
     A page gets a link only once it is announced. To announce a page,
     build it, then flip `announced` to true. Unannounced pages are never
     rendered into the menu or the DOM.
  ---------------------------------------------------------------- */
  const PAGES = [
    { label: "Home",      href: "/",           announced: true  },
    { label: "Allowlist", href: "/allowlist/", announced: false },
    { label: "Sources",   href: "/sources/",   announced: false },
    { label: "Essays",    href: "/essays/",    announced: false },
    { label: "Mint",      href: "/mint/",      announced: false }
  ];

  const menu = document.getElementById("menu");
  const burger = document.getElementById("burger");
  PAGES.filter(p => p.announced).forEach(p => {
    const a = document.createElement("a");
    a.href = p.href; a.textContent = p.label;
    menu.appendChild(a);
  });
  const foot = document.createElement("div");
  foot.className = "u"; foot.textContent = "Mint December 9";
  menu.appendChild(foot);

  function setMenu(open) {
    menu.classList.toggle("open", open);
    burger.setAttribute("aria-expanded", String(open));
    document.body.style.overflow = open ? "hidden" : "";
  }
  burger.addEventListener("click", () => setMenu(!menu.classList.contains("open")));
  menu.addEventListener("click", e => { if (e.target.tagName === "A") setMenu(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });

  /* ---------------------------------------------------------------
     EMAIL SIGNUP -> /api/subscribe (Upstash Redis, same list as the preview)
  ---------------------------------------------------------------- */
  const form = document.getElementById("signupForm");
  const input = document.getElementById("emailInput");
  const btn = document.getElementById("submitBtn");
  const msg = document.getElementById("msg");
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function say(text, err) { msg.textContent = text; msg.classList.toggle("err", !!err); }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = input.value.trim();
    if (!EMAIL_RE.test(email)) { say("Please enter a valid email.", true); input.focus(); return; }
    btn.disabled = true; say("");
    try {
      const res = await fetch("/api/subscribe", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      });
      if (!res.ok) throw new Error(String(res.status));
      input.value = "";
      say("Noted. You will hear first.");
    } catch (_) {
      say("Something went wrong. Please try again.", true);
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
