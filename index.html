<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PUBLIC FACING</title>
<meta name="description" content="500 portraits. 99 sources. Mint Wednesday, December 9.">
<meta property="og:title" content="PUBLIC FACING">
<meta property="og:description" content="500 portraits. 99 sources. Mint Wednesday, December 9.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  /* Wall: bone paper and ink. The accent is black (ink), not cyan. */
  :root {
    --bone: #EFECE5;
    --ink: #1A1A18;
    --ink-dim: #6E6B64;
    --accent: var(--ink);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: var(--bone); color: var(--ink); }
  body {
    font-family: "Cormorant Garamond", Georgia, serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100svh;
    padding-top: var(--safe-t);
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .u {
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
  }

  /* ---- hero ---- */
  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 36px 24px 40px; text-align: center; gap: 28px;
  }
  .strip {
    width: 100%; aspect-ratio: 2160 / 300;
    background: var(--ink); position: relative; overflow: hidden;
  }
  /* Whole image width always shows; the strip just gets taller or shorter with the screen. */
  .strip img { width: 100%; height: 100%; object-fit: fill; display: block; }
  .strip .ph {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: rgba(239,236,229,.5);
  }

  .rule { width: 56px; height: 2px; background: var(--accent); }
  h1 { font-weight: 400; font-size: clamp(34px, 9vw, 60px); letter-spacing: .28em; margin-right: -.28em; line-height: 1; }
  .line { font-size: clamp(20px, 4.6vw, 26px); font-style: italic; }
  .dates { display: flex; flex-direction: column; gap: 6px; color: var(--ink-dim); }
  .dates b { color: var(--ink); font-weight: 400; }

  /* ---- signup ---- */
  .signup { width: min(88vw, 420px); }
  .invite-form {
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--ink); padding: 6px 0;
  }
  .invite-form:focus-within { border-bottom-width: 2px; padding-bottom: 5px; }
  .invite-form input {
    flex: 1; min-width: 0; background: none; border: 0; outline: 0;
    font: inherit; font-size: 20px; color: var(--ink); padding: 6px 0;
  }
  .invite-form input::placeholder { color: var(--ink-dim); font-style: italic; }
  .invite-form button { padding: 10px 2px; }
  .invite-form button:hover { color: var(--ink-dim); }
  .invite-form button:disabled { opacity: .35; cursor: default; }
  #msg { min-height: 1.4em; margin-top: 10px; color: var(--ink-dim); }
  #msg.err { color: #8a2d2d; }

  footer { padding: 16px 24px calc(20px + var(--safe-b)); text-align: center; color: var(--ink-dim); }
</style>
</head>
<body>

<div class="strip">
  <!-- Full-width eye strip, 2160x300 from composite 72. Placeholder shows until it loads. -->
  <img src="assets/eye-strip-72-full.jpg" alt="" onload="this.nextElementSibling.remove()" onerror="this.remove()">
  <div class="ph u">Eye strip</div>
</div>

<main>
  <div class="rule"></div>

  <h1>PUBLIC FACING</h1>
  <p class="line">500 portraits. 99 sources.</p>

  <div class="dates u">
    <span>Mint <b>Wednesday, December 9</b></span>
  </div>

  <div class="signup">
    <form id="signupForm" class="invite-form" novalidate>
      <input type="email" id="emailInput" name="email" placeholder="your@email" autocomplete="email" aria-label="Email address">
      <button type="submit" class="u" id="submitBtn">Notify me</button>
    </form>
    <div id="msg" class="u" role="status" aria-live="polite"></div>
  </div>
</main>

<footer class="u">publicfacing.art</footer>

<script>
  /* ---------------------------------------------------------------
     EMAIL SIGNUP -> /api/subscribe (Upstash Redis, same list as the preview)
  ---------------------------------------------------------------- */
  const form = document.getElementById("signupForm");
  const input = document.getElementById("emailInput");
  const btn = document.getElementById("submitBtn");
  const msg = document.getElementById("msg");
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function say(text, err) { msg.textContent = text; msg.classList.toggle("err", !!err); }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = input.value.trim();
    if (!EMAIL_RE.test(email)) { say("Please enter a valid email.", true); input.focus(); return; }
    btn.disabled = true; say("");
    try {
      const res = await fetch("/api/subscribe", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      });
      if (!res.ok) throw new Error(String(res.status));
      input.value = "";
      say("Noted. You will hear first.");
    } catch (_) {
      say("Something went wrong. Please try again.", true);
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
